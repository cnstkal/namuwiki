<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>자캐위키</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--orange:#e39a1e;--teal:#00a495;--bg:#fff;--text:#222;--line:#ddd;--panel:#f8f8f8;}
*{box-sizing:border-box;}
body{font-family:"Pretendard",Apple SD Gothic Neo,sans-serif;background:var(--bg);color:var(--text);margin:0;}
a{color:#3b7dd8;cursor:pointer;text-decoration:none;} a:hover{text-decoration:underline;}
.gnb{background:var(--teal);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:50;}
.gnb .logo{font-weight:bold;font-size:18px;white-space:nowrap;}
.gnb input{flex:1;min-width:120px;padding:8px 11px;border:none;border-radius:4px;font-size:15px;}
.gnb button{background:#008f80;color:#fff;border:none;padding:7px 11px;border-radius:4px;cursor:pointer;font-size:14px;}
.gnb button:hover{background:#007368;}
.charselect{background:#008f80;color:#fff;border:1px solid #fff4;padding:7px 8px;border-radius:4px;font-size:14px;}
.pageshell{max-width:1000px;margin:0 auto;padding:0 16px 16px;}
.toc-float{float:left;width:230px;margin:0 24px 16px 0;}
.toc-float h4{margin:0 0 6px;font-size:13px;color:#888;}
.toc{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--panel);font-size:13px;}
.toc div{margin:3px 0;}
.toc .lv3{padding-left:12px;font-size:12px;}
.pagebar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:11px;font-size:14px;color:#777;flex-wrap:wrap;gap:6px;}
.pagebar button{font-size:13px;padding:3px 8px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;}
.infobox{float:right;width:460px;margin:0 0 16px;border:2px solid var(--orange);border-radius:4px;overflow:hidden;}
.ib-head{background:var(--orange);color:#fff;text-align:center;padding:10px;}
.ib-head .ib-name{font-size:20px;font-weight:bold;}
.ib-head .ib-sub{font-size:12px;font-weight:normal;opacity:.9;margin-top:2px;}
.photo{width:100%;min-height:180px;background:#eee;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer;}
.photo:has(img){min-height:0;}
.photo img{width:100%;height:auto;object-fit:contain;display:block;}
table.info{width:100%;border-collapse:collapse;font-size:20px;}
table.info th{background:var(--orange);color:#fff;padding:9px;width:108px;text-align:center;vertical-align:middle;border:1px solid #fff3;}
table.info td{padding:9px 10px;border-bottom:1px solid var(--line);background:#fffdf8;vertical-align:middle;}
.rowbtns{display:flex;gap:4px;justify-content:center;padding:4px;background:var(--panel);}
.rowbtns button{font-size:10px;padding:2px 5px;cursor:pointer;}
article{clear:both;}
h2.sec{font-size:26px;font-weight:bold;border-bottom:2px solid var(--orange);padding:4px 2px;margin-top:26px;display:flex;justify-content:space-between;align-items:center;}
h3.sub{font-size:22px;font-weight:bold;border-bottom:1px solid #eee;padding:3px 2px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:#333;}
.txt[contenteditable]{outline:none;}
.secbtns{font-size:15px;color:#999;font-weight:normal;display:flex;gap:8px;}
.secbtns span{cursor:pointer;}
.secbtns span:hover{color:var(--teal);}
.info-paren{font-size:.78em !important;color:#222 !important;font-weight:400;} .name-full{font-size:1em !important;color:inherit !important;font-weight:inherit;} .edu-line{display:block;line-height:1.45;} .edu-school,.edu-status{outline:none;} .edu-school{color:inherit;} .edu-status{font-size:.78em;color:#222;} .birth-age-wrap{color:#222 !important;font-size:1em !important;font-weight:400;} .birth-age-wrap .birth-age{font-size:1em !important;color:#222 !important;font-weight:400;} .sec-body{padding:10px 6px;font-size:19px;line-height:1.75;min-height:34px;outline:none;white-space:pre-wrap;}
.sec-body:empty:before{content:"내용을 입력하세요...";color:#aaa;}
.collapsed{display:none;}
.footnotes{margin-top:30px;border-top:1px solid var(--line);padding-top:10px;font-size:17px;color:#555;}
.gallery{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.gallery .g-item{width:110px;}
.gallery img{width:110px;height:140px;object-fit:cover;border:1px solid var(--line);border-radius:3px;display:block;}
.gallery .cap{font-size:11px;text-align:center;background:var(--orange);color:#fff;padding:2px;}
.gallery .g-del{font-size:10px;text-align:center;color:#c0392b;cursor:pointer;}
.addbar{text-align:center;margin:22px 0;}
.addbar button{background:var(--orange);color:#fff;border:none;padding:10px 16px;border-radius:4px;cursor:pointer;font-size:16px;margin:0 4px;}
.addbar button.alt{background:#666;}
.toolbar{position:fixed;bottom:0;left:0;right:0;background:#2c2c2c;color:#fff;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px;font-size:16px;z-index:60;}
.toolbar button,.toolbar label{background:#484848;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
.toolbar button:hover,.toolbar label:hover{background:var(--teal);}
body{padding-bottom:58px;} input,textarea,select,[contenteditable="true"]{font-size:16px;}
mark.hl{background:#fff29e;}
@media(max-width:750px){.toc-wrap,.infobox{float:none;width:100%;}}
[contenteditable]:focus{background:#fff8e5;}

/* top namu-wiki-like header */
.titleline{display:flex;align-items:center;gap:8px;padding:14px 4px 4px;font-size:24px;font-weight:bold;}
.titleline .num{background:#eee;color:#888;font-size:12px;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;}
.catbar{border:1px solid var(--line);background:#fafafa;padding:8px 10px;font-size:16px;color:#555;margin:8px 0 6px;}
.catbar b{color:#3b7dd8;cursor:pointer;font-weight:normal;}
.catbar span.sep{color:#ccc;margin:0 4px;}
.lockline{display:flex;align-items:center;gap:6px;font-size:16px;color:#444;margin-bottom:14px;}
.lockline .ico{color:#888;}
.lockline a{color:#3b7dd8;}
.navbox{border:2px solid var(--orange);margin-bottom:4px;border-radius:8px;overflow:hidden;background:var(--orange);}
.navbox .nb-head{background:var(--orange);color:#fff;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:10px 14px;}
.navbox .nb-logo{font-weight:900;font-size:40px;font-style:italic;line-height:1;}
.navbox .nb-divider{width:1px;align-self:stretch;background:#fff6;}
.navbox .nb-title{line-height:1.2;text-align:left;}
.navbox .nb-title .en{font-size:13px;display:block;}
.navbox .nb-title .kr{font-size:16px;display:block;font-weight:bold;}
.navbox .nb-members{display:flex;flex-wrap:wrap;justify-content:center;padding:10px 4px;background:var(--orange);}
.navbox .nb-members .mem-item{flex:0 0 12.5%;max-width:12.5%;text-align:center;font-size:16px;padding:3px 2px;color:#fff !important;cursor:text;outline:none;}
.navbox .nb-toggle{text-align:center;font-size:15px;color:#fff;cursor:pointer;padding:4px;background:var(--orange);opacity:.85;}
.navbox .nb-toggle:hover{opacity:1;}
.navbox .nb-links{display:none;text-align:center;font-size:17px;font-weight:bold;}
.navbox .nb-links.show{display:flex;}
.navbox .nb-links div{flex:1;padding:8px 2px;color:#fff;cursor:pointer;background:var(--orange);}
.navbox .nb-links div:hover{background:#d68e1c;}
.navwrap{margin-bottom:16px;}
.opt-chip{background:#eee;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;color:#666;font-size:13px;}
.opt-chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
table.info td.v-blue{color:#3b7dd8;}
table.info tr.opt-row{display:none;}
table.info tr.opt-row.on{display:table-row;}
.sig-cell{padding:6px !important;}
.sig-box{width:100%;min-height:56px;max-height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px dashed var(--line);border-radius:3px;cursor:pointer;overflow:hidden;}
.sig-box img{max-width:140px;max-height:52px;object-fit:contain;}
.sig-box span{font-size:11px;color:#999;}

/* ---- namu-wiki-like page grid ---- */
.gnb .gnb-link{color:#fff;opacity:.9;font-size:15px;white-space:nowrap;}
.gnb .gnb-link:hover{opacity:1;text-decoration:underline;}
.gnb-user{width:26px;height:26px;border-radius:50%;background:#008f80;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.pagegrid{display:flex;max-width:1400px;margin:0 auto;gap:24px;padding:16px 16px 40px;align-items:flex-start;}
.pagemain{flex:1;min-width:0;max-width:1000px;}
.rightpanel{width:280px;flex-shrink:0;position:sticky;top:60px;}
@media(max-width:1100px){.rightpanel{display:none;}}
.rp-box{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden;background:#fff;}
.rp-box h5{margin:0;padding:10px 12px;font-size:13px;background:#fafafa;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;}
.rp-box ul{list-style:none;margin:0;padding:6px 0;}
.rp-box li{padding:6px 12px;font-size:12.5px;display:flex;justify-content:space-between;color:#444;}
.rp-box li b{color:#3b7dd8;font-weight:normal;margin-right:6px;}
.rp-box li span.t{color:#aaa;font-size:11px;white-space:nowrap;}

.titleline{justify-content:space-between;}
.title-icons{display:flex;gap:12px;font-size:12.5px;color:#888;font-weight:normal;margin-left:auto;}
.title-icons span{cursor:pointer;white-space:nowrap;}
.title-icons span:hover{color:var(--teal);}

.toc-wrap{float:left;width:330px;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;background:var(--panel);margin:0 0 18px;}
.toc-wrap .toc-hd{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 12px;font-weight:bold;font-size:17px;cursor:pointer;}
.toc-wrap .toc-hd:hover{background:#f0f0f0;}
.toc-body{padding:0 12px 10px;font-size:16px;}
.toc-body div{margin:3px 0;}
.toc-body .lv3{padding-left:12px;font-size:15px;color:#555;}
.toc-wrap.closed .toc-body{display:none;}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;}

@media(max-width:750px){
  #captureArea{display:flex;flex-direction:column;}
  #captureArea .titleline{order:1;}
  #captureArea .pagebar{order:2;}
  #captureArea .catbar{order:3;}
  #captureArea .lockline{order:4;}
  #captureArea .navwrap{order:5;}
  #captureArea #optToggleBar{order:6;}
  #captureArea .infobox{order:7;}
  #captureArea .toc-wrap{order:8;}
  #captureArea > div[style*="clear:both"]{order:9;}
  #captureArea #sections{order:10;}
  #captureArea .addbar{order:11;}
  #captureArea .footnotes{order:12;}
  #captureArea .infobox{float:none;width:100%;margin:0 0 16px;}
  #captureArea .toc-wrap{float:none;width:100%;margin:0 0 18px;}
}

/* iOS Safari: 입력/편집 시 자동 확대 방지 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
input,textarea,select,[contenteditable="true"]{-webkit-text-size-adjust:100%;font-size:16px !important;}
</style>
</head>
<body>
<svg style="display:none">
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M4 4v13a3 3 0 0 0 3 3h11"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>

</svg>
<div class="gnb">
  <span class="logo"><svg class="ic" style="width:16px;height:16px;"><use href="#i-book"/></svg> 자캐위키</span>
  <a class="gnb-link">최근 변경</a>
  <a class="gnb-link">최근 토론</a>
  <a class="gnb-link">특수 기능 ▾</a>
  <input id="searchBox" placeholder="문서 내 검색" oninput="doSearch(this.value)">
  <button onclick="clearSearch()"><svg class="ic"><use href="#i-close"/></svg></button>
  <span class="gnb-user"><svg class="ic" style="stroke:#fff;"><use href="#i-user"/></svg></span>
</div>

<div class="pagegrid">
  <div class="pagemain">
    <article id="captureArea">
      <div class="catbar" id="catbar"><span style="color:#555;">분류:</span> <b contenteditable style="color:#3b7dd8;">원빈(RIIZE)</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">RIIZE</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">한국 남가수</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">2002년 출생</b></div>
      <div class="lockline"><span class="ico" id="lockIco"><svg class="ic"><use href="#i-lock"/></svg></span><span id="lockText">편집 보호된 문서입니다.</span></div>

      <div class="navwrap" id="navwrap">
        <div class="navbox">
          <div class="nb-head">
            <span class="nb-logo" contenteditable id="nbLogo">GROUP</span>
            <span class="nb-divider"></span>
            <span class="nb-title"><span class="en" contenteditable id="nbTitleEn">GROUP NAME</span><span class="kr" contenteditable id="nbTitleKr">그룹명</span></span>
          </div>
          <div class="nb-members" id="nbMembers"></div>
          <div class="nb-links" id="nbLinks"><div contenteditable>[ 한국 음반 ]</div><div contenteditable>[ 해외 음반 ]</div><div contenteditable>[ 기타 음반 ]</div><div contenteditable>[ 관련 문서 ]</div></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 6px;">
        <div id="optToggleBar" style="font-size:12px;color:#777;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">선택 항목:</div>
        <button onclick="toggleNbLinks()" id="nbToggleBtn" style="font-size:12px;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;">⌄ 음반 목록 보기</button>
      </div>

      <div class="toc-wrap" id="tocWrap">
        <div class="toc-hd" onclick="toggleToc()"><span>목차</span><span id="tocChevron">⌄</span></div>
        <div class="toc-body" id="toc"></div>
      </div>

      <div class="infobox">
        <div class="ib-head">
          <div class="ib-name txt" contenteditable id="charname">이름을 입력하세요</div>
          <div class="ib-sub txt" contenteditable id="charname-en">별칭 / 영문명 / 부제</div>
        </div>
        <div class="photo" id="photoBox" onclick="document.getElementById('fileInput').click()">
          <span style="color:#999;font-size:13px;">클릭해서 사진 업로드</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <table class="info" id="infoTable"></table>
      </div>

      <div style="clear:both;"></div>

      <div id="sections"></div>

      <div class="addbar">
        <button onclick="addSection(2)">+ 큰 문단 추가</button>
        <button class="alt" onclick="addSection(3)">+ 하위 문단 추가</button>
        <button class="alt" onclick="addGallery()">+ 사진첩 추가</button>
      </div>

      <div class="footnotes"><b>각주</b>
        <div id="fnlist" contenteditable style="margin-top:6px;"></div>
      </div>
    </article>
  </div>

  <div class="rightpanel">
    <div class="rp-box">
      <h5><svg class="ic"><use href="#i-building"/></svg> 실시간 검색어</h5>
      <ul>
        <li><span><b>1</b>안세영</span><span class="t">NEW</span></li>
      </ul>
    </div>
    <div class="rp-box">
      <h5><svg class="ic"><use href="#i-clock"/></svg> 최근 변경</h5>
      <ul>
        <li><span>문서 편집 내역이 여기 표시돼요</span></li>
      </ul>
    </div>
  </div>
</div>

<div class="toolbar">
  <button onclick="saveData()">💾 저장</button>
  <button onclick="exportImage()">🖼 이미지로 저장</button>
  <button onclick="if(confirm('이 문서의 모든 내용을 초기화할까요?'))resetCurrent()">🗑 초기화</button>
</div>

<script>
const LIST_KEY='jacae-wiki-list';
let currentId=null, locked=false;
const INFO_FIELDS=[
  {key:'name',label:'본명',blue:false},
  {key:'birth',label:'출생',blue:true},
  {key:'from',label:'출신',blue:true},
  {key:'nation',label:'국적',blue:true},
  {key:'clan',label:'본관',blue:true,optional:true},
  {key:'body',label:'신체',blue:false},
  {key:'family',label:'가족',blue:false},
  {key:'edu',label:'학력',blue:true},
  {key:'religion',label:'종교',blue:true,optional:true},
  {key:'agency',label:'소속사',blue:true},
  {key:'group',label:'소속 그룹',blue:true},
  {key:'position',label:'포지션',blue:false},
  {key:'emoji',label:'이모지',blue:false,optional:true},
  {key:'debut',label:'데뷔',blue:false},
  {key:'mbti',label:'MBTI',blue:false},
  {key:'nickname',label:'별명',blue:false},
  {key:'signature',label:'서명',blue:false,optional:true}
];

function uid(){return 'c'+Date.now()+Math.random().toString(36).slice(2,6);}
function loadList(){ try{return JSON.parse(localStorage.getItem(LIST_KEY))||{};}catch(e){return {};} }
function saveList(l){localStorage.setItem(LIST_KEY, JSON.stringify(l));}

function refreshCharSelect(){
  const list=loadList();
  const sel=document.getElementById('charSelect');
  if(!sel) return;
  sel.innerHTML='';
  Object.keys(list).forEach(id=>{
    const o=document.createElement('option');
    o.value=id; o.textContent=(list[id].name||'').replace(/<[^>]+>/g,'') || '(이름 없음)';
    if(id===currentId) o.selected=true;
    sel.appendChild(o);
  });
}

function blankDoc(){
  return {
    pageTitle:'문서 제목',
    catbar:'<span style="color:#555;">분류:</span> <b contenteditable style="color:#3b7dd8;">원빈(RIIZE)</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">RIIZE</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">한국 남가수</b><span class="sep">|</span><b contenteditable style="color:#3b7dd8;">2002년 출생</b>',
    lockText:'편집 보호된 문서입니다.',
    nbLogo:'GROUP', nbTitleKr:'그룹명', nbTitleEn:'GROUP NAME',
    nbMembersList:['멤버1','멤버2','멤버3','멤버4'],
    name:'새 캐릭터', nameEn:'별칭 / 영문명',
    info:{
      name:'홍길동 (洪吉童, Hong Gil-dong)',
      birth:'2002년 3월 2일 (24세)',
      from:'서울특별시 성북구',
      nation:'대한민국',
      clan:'남양 홍씨 (南陽 洪氏)',

function makeMemberItem(text){

  el.className='mem-item'; el.contentEditable=true; el.textContent=text||'멤버';

    if(e.key==='Enter'){

      el.after(n);
      n.focus();
      persist();
    } else if(e.key==='Backspace' && el.textContent===''){

      el.remove();
      if(prev){ prev.focus(); const r=document.createRange(); r.selectNodeContents(prev); r.collapse(false); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      persist();
    }
  });

}

function updateBirthAge(td){
  if(!td) return;
  const raw=td.textContent.replace(/\\s+/g,' ').trim();
  const m=raw.match(/(\\d{4})\\s*[년.\\/-]\\s*(\\d{1,2})\\s*[월.\\/-]\\s*(\\d{1,2})\\s*일?/);
  if(!m) return;
  const y=Number(m[1]), mo=Number(m[2]), d=Number(m[3]);
  const birth=new Date(y,mo-1,d);
  if(birth.getFullYear()!==y || birth.getMonth()!==mo-1 || birth.getDate()!==d) return;

  const today=new Date();
  let age=today.getFullYear()-y;
  if(today.getMonth()<mo-1 || (today.getMonth()===mo-1 && today.getDate()<d)) age--;

  const dateText=y+'년 '+mo+'월 '+d+'일';
  td.innerHTML='';
  const ageWrap=document.createElement('span');
  ageWrap.className='birth-age-wrap';
  ageWrap.appendChild(document.createTextNode(dateText+' ('));
  const ageSpan=document.createElement('span');
  ageSpan.className='birth-age';
  ageSpan.contentEditable='true';
  ageSpan.textContent=age+'세';
  ageWrap.appendChild(ageSpan);
  ageWrap.appendChild(document.createTextNode(')'));
  td.appendChild(ageWrap);
}



function styleInfoParentheses(td){
  if(!td) return;

  if(td.dataset.key==='name'){
    const raw=td.textContent.trim();
    td.innerHTML='';
    const span=document.createElement('span');
    span.className='name-full';
    span.contentEditable='true';
    span.textContent=raw || '홍길동 (洪吉童), Hong Gil-dong';
    td.appendChild(span);
    return;
  }

  if(td.dataset.key==='edu'){
    // 이미 정상적인 학력 구조라면 입력 중에는 절대 다시 만들지 않는다.
    if(td.querySelector('.edu-line')) return;

    const raw=td.textContent.trim();
    let school=raw;
    let status='졸업';

    const open=raw.lastIndexOf('(');
    const close=raw.lastIndexOf(')');
    if(open>=0 && close>open){
      school=raw.slice(0,open).trim();
      status=raw.slice(open+1,close).trim() || '졸업';
    }

    // 이전 버전에서 중복 생성된 학력 데이터는 정상 기본값으로 정리
    if(!school || school.indexOf('초등')>=0) school='초등학교';

    td.innerHTML='';

    const lineWrap=document.createElement('div');
    lineWrap.className='edu-line';

    const schoolSpan=document.createElement('span');
    schoolSpan.className='edu-school';
    schoolSpan.contentEditable='true';
    schoolSpan.textContent=school;

    const statusSpan=document.createElement('span');
    statusSpan.className='edu-status';
    statusSpan.contentEditable='true';
    statusSpan.textContent=status;

    lineWrap.appendChild(schoolSpan);
    lineWrap.appendChild(document.createTextNode(' ('));
    lineWrap.appendChild(statusSpan);
    lineWrap.appendChild(document.createTextNode(')'));
    td.appendChild(lineWrap);

    td.contentEditable='false';
    return;
  }

  const walker=document.createTreeWalker(td,NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while(n=walker.nextNode()){
    if(n.parentElement && n.parentElement.classList.contains('info-paren')) continue;
    if(n.textContent.indexOf('(')>=0 || n.textContent.indexOf('（')>=0) nodes.push(n);
  }

  nodes.forEach(node=>{
    const text=node.textContent;
    const frag=document.createDocumentFragment();
    let pos=0;
    while(pos<text.length){
      const a=text.indexOf('(',pos);
      const b=text.indexOf('（',pos);
      let open=a<0?b:(b<0?a:Math.min(a,b));
      if(open<0){
        frag.appendChild(document.createTextNode(text.slice(pos)));
        break;
      }
      if(open>pos) frag.appendChild(document.createTextNode(text.slice(pos,open)));

      const close1=text.indexOf(')',open+1);
      const close2=text.indexOf('）',open+1);
      let close=close1<0?close2:(close2<0?close1:Math.min(close1,close2));
      if(close<0){
        frag.appendChild(document.createTextNode(text.slice(open)));
        break;
      }

      const span=document.createElement('span');
      span.className='info-paren';
      span.textContent=text.slice(open,close+1);
      frag.appendChild(span);
      pos=close+1;
    }
    node.parentNode.replaceChild(frag,node);
  });
}


function renderInfoTable(info, optOn){
  const table=document.getElementById('infoTable'); table.innerHTML='';
  INFO_FIELDS.forEach(f=>{
    const tr=document.createElement('tr');
    if(f.optional){ tr.className='opt-row'+(optOn[f.key]?' on':''); }
    const th=document.createElement('th'); th.textContent=f.label;
    let td;
    if(f.key==='signature'){
      td=document.createElement('td'); td.className='sig-cell';
      const box=document.createElement('div'); box.className='sig-box';
      box.innerHTML = info.signature ? '<img src="'+info.signature+'">' : '<span>클릭해서 서명 사진 추가</span>';
      box.onclick=()=>{
        const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
        inp.onchange=e=>{
          const file=e.target.files[0]; if(!file) return;
          const r=new FileReader();
          r.onload=ev=>{
            const d=getDoc(); if(!d.info) d.info={};
            d.info.signature=ev.target.result;
            setDoc(dd=>dd.info=d.info);
            box.innerHTML='<img src="'+ev.target.result+'">';
          };

        };
        inp.click();
      };

      td=document.createElement('td'); td.contentEditable=f.key!=='edu'; td.dataset.key=f.key;
      if(f.blue) td.classList.add('v-blue');
      td.innerHTML = info[f.key] || ''; if(f.key==='birth') updateBirthAge(td); else styleInfoParentheses(td);
    }
    tr.appendChild(th); tr.appendChild(td); table.appendChild(tr);
  });
}

function collectFromDOM(){
  const prevInfo=(getDoc()&&getDoc().info)||{};
  const info=Object.assign({}, prevInfo);
  document.querySelectorAll('#infoTable td[data-key]').forEach(td=>{ if(td.dataset.key==='birth') updateBirthAge(td); else { if(td.dataset.key==='edu' && !td.querySelector('.edu-school')) styleInfoParentheses(td); else if(td.dataset.key!=='edu') styleInfoParentheses(td); } info[td.dataset.key]=td.innerHTML; });
  const optOn=getDoc()?Object.assign({},getDoc().optOn):{};
  const img=document.querySelector('#photoBox img');
  const secs=[]; const galleries=[];
  const kids=[...document.getElementById('sections').children];
  for(let i=0;i<kids.length;i++){
    const el=kids[i];
    if(el.tagName==='H2' && el.classList.contains('sec')){
      const body=kids[i+1]; secs.push({lvl:2,title:el.querySelector('.txt').textContent, body:body?body.innerHTML:''});
    } else if(el.tagName==='H3' && el.classList.contains('sub')){
      const next=kids[i+1];
      if(next && next.classList.contains('gallery')){
        const items=[...next.querySelectorAll('.g-item')].map(gi=>({src:gi.querySelector('img').src, cap:gi.querySelector('.cap').textContent}));
        galleries.push({title:el.querySelector('.txt').textContent, items});
      } else {
        secs.push({lvl:3,title:el.querySelector('.txt').textContent, body:next?next.innerHTML:''});
      }
    }
  }
  return {
    pageTitle:(getDoc()&&getDoc().pageTitle)||'',
    catbar:document.getElementById('catbar').innerHTML,
    lockText:document.getElementById('lockText').textContent,
    nbLogo:document.getElementById('nbLogo').innerHTML,
    nbTitleKr:document.getElementById('nbTitleKr').innerHTML,
    nbTitleEn:document.getElementById('nbTitleEn').innerHTML,
    nbMembersList:[...document.querySelectorAll('#nbMembers .mem-item')].map(el=>el.textContent),
    name:document.getElementById('charname').innerHTML,
    nameEn:document.getElementById('charname-en').innerHTML,
    photo: img?img.src:'',
    info, optOn, secs, galleries,
    footnotes: document.getElementById('fnlist').innerHTML,
    locked: locked
  };
}

function doSearch(q){
  document.querySelectorAll('mark.hl').forEach(m=>{ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  if(!q) return;
  const walker=document.createTreeWalker(document.getElementById('sections'), NodeFilter.SHOW_TEXT);
  const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    const idx=node.textContent.toLowerCase().indexOf(q.toLowerCase());
    if(idx<0) return;
    const range=document.createRange(); range.setStart(node, idx); range.setEnd(node, idx+q.length);
    const mark=document.createElement('mark'); mark.className='hl';
    try{ range.surroundContents(mark); }catch(e){}
  });
  const first=document.querySelector('mark.hl');
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
}

  const list=loadList();
  let ids=Object.keys(list);
  if(!ids.length){ const id=uid(); list[id]=blankDoc(); saveList(list); ids=[id]; }
  currentId = localStorage.getItem('jacae-current') || ids[0];
  if(!list[currentId]) currentId=ids[0];
  refreshCharSelect();
  render();
})();
</script>
